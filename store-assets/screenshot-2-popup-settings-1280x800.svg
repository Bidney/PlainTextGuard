<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#101a30"/>
  <text x="70" y="92" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#fff">Catch secrets before they reach the prompt.</text>
  <text x="72" y="137" font-family="Arial,sans-serif" font-size="22" fill="#b9c5da">After you enable the guard, credentials are detected locally during a user-initiated paste.</text>
  <g transform="translate(85 195)" font-family="Arial,sans-serif">
    <rect width="1110" height="520" rx="22" fill="#fff"/>
    <g transform="translate(36 38)">
      <rect width="488" height="444" rx="16" fill="#f5f7fb"/>
      <text x="26" y="48" font-size="19" font-weight="700" fill="#1c2942">AI chat composer</text>
      <rect x="26" y="76" width="436" height="210" rx="14" fill="#fff" stroke="#d8e0ec"/>
      <text x="47" y="115" font-size="16" fill="#52617a">Please inspect this configuration:</text>
      <text x="47" y="157" font-family="monospace" font-size="15" fill="#52617a">AWS_ACCESS_KEY_ID=AKIA••••••••••••</text>
      <text x="47" y="191" font-family="monospace" font-size="15" fill="#52617a">API_TOKEN=••••••••••••••••</text>
      <text x="47" y="235" font-size="15" fill="#9a3f45">Paste paused before the text reached the chat.</text>
      <rect x="26" y="320" width="436" height="84" rx="12" fill="#e8fff3"/>
      <text x="48" y="352" font-size="16" font-weight="700" fill="#167653">Local detection</text>
      <text x="48" y="381" font-size="15" fill="#436a5c">No pasted text is uploaded or stored.</text>
    </g>
    <g transform="translate(558 52)">
      <rect width="510" height="416" rx="18" fill="#fff" stroke="#de6b73" stroke-width="2"/>
      <circle cx="48" cy="50" r="22" fill="#ffe8ea"/><text x="41" y="58" font-size="27" font-weight="700" fill="#ca3844">!</text>
      <text x="84" y="48" font-size="24" font-weight="700" fill="#17233d">Possible secrets detected</text>
      <text x="30" y="91" font-size="16" fill="#64728a">Review before pasting into this AI chat.</text>
      <rect x="30" y="120" width="450" height="124" rx="12" fill="#fff3f4"/>
      <text x="50" y="154" font-size="17" font-weight="700" fill="#8d2e37">AWS access key</text>
      <text x="50" y="184" font-size="15" fill="#6c4d52">High confidence · value will be redacted</text>
      <text x="50" y="219" font-family="monospace" font-size="15" fill="#8d2e37">AKIA••••••••••••</text>
      <rect x="30" y="275" width="205" height="46" rx="9" fill="#295fc4"/><text x="51" y="304" font-size="15" font-weight="700" fill="#fff">Paste without secrets</text>
      <rect x="248" y="275" width="132" height="46" rx="9" fill="#edf1f7"/><text x="269" y="304" font-size="15" font-weight="700" fill="#36445d">Paste anyway</text>
      <text x="407" y="304" font-size="15" fill="#718099">Cancel</text>
      <text x="30" y="365" font-size="14" fill="#718099">The final decision always stays with you.</text>
    </g>
  </g>
</svg>
